<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptImage — coolThing</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #1a1a1a;
            --text: #e0e0e0;
            --accent: #ff00ff;
            --accent-dim: #770077;
            --font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            color: var(--accent);
            text-shadow: 2px 2px #00ffff;
            margin: 0;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel);
            border: 2px solid var(--accent);
            box-shadow: 10px 10px 0px var(--accent-dim);
            padding: 30px;
            box-sizing: border-box;
        }

        .upload-zone {
            border: 2px dashed #444;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-bottom: 20px;
        }

        .upload-zone:hover {
            border-color: var(--accent);
        }

        #fileInput {
            display: none;
        }

        .preview {
            max-width: 100%;
            max-height: 400px;
            display: none;
            margin: 0 auto 20px auto;
            border: 1px solid #444;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            min-height: 20px;
            color: var(--accent);
        }

        .results {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .control {
            min-width: 0;
        }

        select {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #00ffff;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .toggle-row input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #00ffff;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            box-sizing: border-box;
        }

        .helper {
            margin: 6px 0 0;
            color: #aaa;
            font-size: 0.85rem;
        }

        .actions {
            text-align: center;
            margin-bottom: 20px;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        button:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        input:focus-visible,
        .upload-zone:focus-visible {
            outline: 2px solid #00ffff;
            outline-offset: 2px;
        }

        .copy-btn,
        .action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .copy-btn:hover {
            background: #fff;
        }

        .copy-btn:active {
            transform: translateY(1px);
        }

        .variation {
            min-height: 60px;
        }

        .back-link {
            margin-top: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Scanline effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 2.2rem;
                letter-spacing: 0;
            }

            .container {
                padding: 20px;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>PROMPT-IMAGE</h1>
        <div class="subtitle">AI Vision for Perchance.org — interpret any image</div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="control">
                <label for="styleSelect">STYLE</label>
                <select id="styleSelect">
                    <option value="open">Open / No Preset</option>
                    <option value="perchance">Perchance Fantasy</option>
                    <option value="photoreal">Photorealistic</option>
                    <option value="photo90s">1990s Photo</option>
                    <option value="photo80s">1980s Photo</option>
                    <option value="pulp">Vintage Pulp Art</option>
                    <option value="cinematic">Cinematic</option>
                    <option value="anime">Anime</option>
                    <option value="oil">Oil Painting</option>
                    <option value="pixel">Pixel Art</option>
                    <option value="album">Album Cover</option>
                    <option value="logo">Logo / Icon</option>
                </select>
            </div>

            <div class="control">
                <label for="detailSelect">DETAIL</label>
                <select id="detailSelect">
                    <option value="free">Free</option>
                    <option value="balanced">Balanced</option>
                    <option value="short">Short</option>
                    <option value="ultra">Ultra Detailed</option>
                </select>
            </div>
        </div>

        <label class="toggle-row">
            <input type="checkbox" id="variationToggle">
            MAKE 5 VARIATIONS
        </label>

        <div class="field">
            <label for="providerSelect">PROVIDER</label>
            <select id="providerSelect" aria-describedby="providerHelp">
                <option value="ollama">Local (Ollama)</option>
                <option value="openai">OpenAI</option>
            </select>
            <p class="helper" id="providerHelp"></p>
        </div>

        <div class="upload-zone" id="dropZone" role="button" tabindex="0" aria-describedby="uploadHint">
            <p id="uploadHint">DRAG & DROP IMAGE OR CLICK TO BROWSE</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <img id="previewImage" class="preview" alt="Uploaded image preview">

        <div class="status" id="status" role="status" aria-live="polite">READY</div>

        <div class="actions">
            <button class="action-btn" id="regenerateBtn" hidden>REGENERATE</button>
        </div>

        <div class="results" id="results">
            <div class="field">
                <label for="promptText">PROMPT</label>
                <textarea id="promptText"></textarea>
                <button class="copy-btn" onclick="copy('promptText')">COPY PROMPT</button>
            </div>

            <div class="field">
                <label for="negPromptText">NEGATIVE PROMPT</label>
                <textarea id="negPromptText"></textarea>
                <button class="copy-btn" onclick="copy('negPromptText')">COPY NEGATIVE</button>
            </div>

            <div class="field" id="variationsField" style="display: none;">
                <label for="variation1">VARIATIONS</label>
                <textarea id="variation1" class="variation" aria-label="Variation 1"></textarea>
                <button class="copy-btn" onclick="copy('variation1')">COPY V1</button>
                <textarea id="variation2" class="variation" aria-label="Variation 2"></textarea>
                <button class="copy-btn" onclick="copy('variation2')">COPY V2</button>
                <textarea id="variation3" class="variation" aria-label="Variation 3"></textarea>
                <button class="copy-btn" onclick="copy('variation3')">COPY V3</button>
                <textarea id="variation4" class="variation" aria-label="Variation 4"></textarea>
                <button class="copy-btn" onclick="copy('variation4')">COPY V4</button>
                <textarea id="variation5" class="variation" aria-label="Variation 5"></textarea>
                <button class="copy-btn" onclick="copy('variation5')">COPY V5</button>
            </div>
        </div>
    </div>

    <a href="../index.html" class="back-link">&lt; BACK TO COOLTHING</a>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const promptText = document.getElementById('promptText');
        const negPromptText = document.getElementById('negPromptText');
        const styleSelect = document.getElementById('styleSelect');
        const detailSelect = document.getElementById('detailSelect');
        const variationToggle = document.getElementById('variationToggle');
        const providerSelect = document.getElementById('providerSelect');
        const providerHelp = document.getElementById('providerHelp');
        const regenerateBtn = document.getElementById('regenerateBtn');
        const variationsField = document.getElementById('variationsField');

        const PROVIDER_HELP = {
            ollama: 'Runs locally with Ollama. The image never leaves this machine.',
            openai: 'Sends the image to the OpenAI API (gpt-4o-mini). Requires OPENAI_API_KEY in the backend.'
        };
        const BACKEND_START = 'cd backend && .venv/bin/uvicorn app:app --port 8001';

        let currentFile = null;
        let busy = false;

        function updateProviderHelp() {
            providerHelp.textContent = PROVIDER_HELP[providerSelect.value];
        }
        providerSelect.onchange = updateProviderHelp;
        updateProviderHelp();

        dropZone.onclick = () => fileInput.click();

        dropZone.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                fileInput.click();
            }
        };

        regenerateBtn.onclick = () => generate();

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--accent)';
        };

        dropZone.ondragleave = () => {
            dropZone.style.borderColor = '#444';
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            handleFile(e.dataTransfer.files[0]);
        };

        const API_BASE = window.location.hostname === '127.0.0.1'
            ? 'http://127.0.0.1:8001'
            : 'http://localhost:8001';

        function handleFile(file) {
            if (!file || busy) return;
            currentFile = file;

            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
            };
            reader.readAsDataURL(file);

            generate();
        }

        async function generate() {
            if (!currentFile || busy) return;
            busy = true;
            regenerateBtn.hidden = false;
            regenerateBtn.disabled = true;

            // Keep the previous result visible until the new one arrives.
            const started = Date.now();
            const tick = () => {
                status.textContent = `INTERPRETING... ${Math.round((Date.now() - started) / 1000)}s`;
            };
            tick();
            const timer = setInterval(tick, 1000);

            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('style', styleSelect.value);
            formData.append('detail', detailSelect.value);
            formData.append('variations', variationToggle.checked ? 'true' : 'false');
            formData.append('provider', providerSelect.value);

            try {
                const response = await fetch(`${API_BASE}/prompt-image`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let message = 'Failed to interpret image';
                    try {
                        const errorData = await response.json();
                        message = errorData.detail || message;
                    } catch (_) {
                        message = response.statusText || message;
                    }
                    throw new Error(message);
                }

                const data = await response.json();
                
                promptText.value = data.prompt;
                negPromptText.value = data.negative_prompt;
                renderVariations(data.variations || []);
                
                status.textContent = `COMPLETE (${Math.round((Date.now() - started) / 1000)}s)`;
                results.style.display = 'block';
            } catch (err) {
                console.error(err);
                // fetch() rejects with TypeError when nothing answers on the port.
                status.textContent = err instanceof TypeError
                    ? `ERROR: BACKEND OFFLINE (${API_BASE}). Start: ${BACKEND_START}`
                    : 'ERROR: ' + err.message;
            } finally {
                clearInterval(timer);
                busy = false;
                regenerateBtn.disabled = false;
            }
        }

        function renderVariations(variations) {
            variationsField.style.display = variations.length ? 'block' : 'none';

            for (let i = 1; i <= 5; i++) {
                const field = document.getElementById(`variation${i}`);
                field.value = variations[i - 1] || '';
                field.style.display = variations[i - 1] ? 'block' : 'none';
                field.nextElementSibling.style.display = variations[i - 1] ? 'inline-block' : 'none';
            }
        }

        async function copy(id) {
            const el = document.getElementById(id);
            const btn = el.nextElementSibling;
            const originalText = btn.textContent;
            try {
                await navigator.clipboard.writeText(el.value);
                btn.textContent = 'COPIED!';
            } catch (_) {
                // Clipboard API needs https or localhost; let the user copy manually.
                el.select();
                btn.textContent = 'PRESS CMD/CTRL+C';
            }
            setTimeout(() => btn.textContent = originalText, 2000);
        }
    </script>
</body>
</html>
