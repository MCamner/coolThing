<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MQ-TAB — coolThing</title>
  <meta name="description" content="Guitar Pro reader and player in the browser. Open gp3–gp8 files, read notation and tab, play back with a cursor, loop, tempo and metronome.">
  <link rel="canonical" href="https://mcamner.github.io/coolThing/mq-tab/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="coolThing">
  <meta property="og:title" content="MQ-TAB">
  <meta property="og:description" content="Guitar Pro reader and player in the browser.">
  <meta property="og:url" content="https://mcamner.github.io/coolThing/mq-tab/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <style>
/* Layout: guitar case lining around a sheet of manuscript paper; the transport
   is a single effects pedal docked at the bottom. The pedal is the one loud
   element — everything else stays quiet. */
:root {
  --plush: #2a1216;
  --plush-hi: #3b1a1f;
  --plush-text: #c8a7a2;
  --paper: #eef0ea;
  --ink: #1d1f24;
  --enamel: #2f6b57;
  --enamel-dark: #245647;
  --silk: #f2efe4;
  --led: #ff3326;
  --led-ink: #c4241a;
  --chrome: #cfd3d8;
  /* Pentatonic box colours, dark enough for fret numbers on paper (≥5:1). */
  --box1: #b0381f;
  --box2: #8a5600;
  --box3: #2c6b3a;
  --box4: #22599a;
  --box5: #6b3c9c;
  /* Same boxes, light enough to read on the rosewood fretboard (≥5:1). */
  --wood: #2e1f18;
  --box1-hi: #ef6a4f;
  --box2-hi: #e8ae3a;
  --box3-hi: #66b876;
  --box4-hi: #5f9ee0;
  --box5-hi: #a77ddb;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }

body {
  display: grid;
  grid-template-rows: auto 1fr auto;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--plush-hi), transparent 70%),
    var(--plush);
  color: var(--paper);
  font: 400 15px/1.45 var(--font);
  font-stretch: 100%;
}

:focus-visible { outline: 2px solid var(--silk); outline-offset: 3px; }

/* ── Header ── */
.top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end;
  gap: 4px 28px;
  padding: 14px 24px 18px;
}

.home {
  grid-column: 1 / -1;
  justify-self: start;
  color: var(--plush-text);
  font-size: 14px;
  text-decoration: none;
}
.home:hover { color: var(--paper); }

.song { grid-column: 1 / 3; min-width: 0; }
.song h1 {
  margin: 0;
  overflow: hidden;
  font-size: clamp(34px, 5.4vw, 72px);
  font-stretch: 62%;
  font-weight: 850;
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.song h1.is-empty { color: var(--plush-text); font-weight: 600; }
.song p { margin: 6px 0 0; color: var(--plush-text); font-size: 15px; }

/* Box key: looks like the fret numbers it explains — coloured digits on paper */
.key {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  margin-top: 10px;
  color: var(--paper);
  font-size: 14px;
}
.key__boxes { display: inline-flex; gap: 4px; }
.key__boxes span {
  min-width: 26px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--paper);
  font-weight: 700;
  text-align: center;
}

.view {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

.btn, .select {
  min-height: 34px;
  padding: 5px 12px;
  border: 1px solid rgba(238, 240, 234, 0.28);
  border-radius: 6px;
  background: transparent;
  color: var(--paper);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.btn:hover:not(:disabled), .select:hover { border-color: var(--paper); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn--open { background: var(--paper); border-color: var(--paper); color: var(--ink); font-weight: 650; }
.select { background: var(--plush); }
.zoom { display: inline-flex; align-items: center; gap: 2px; }
.zoom .btn { width: 34px; padding: 0; }
.zoom output { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

/* ── Body: tracks + sheet ── */
.desk {
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr);
  gap: 24px;
  min-height: 0;
  padding: 0 24px;
}

.stage {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  min-height: 0;
  min-width: 0;
}

/* Section strip: one block per analysed section, width = number of bars */
.sections { min-width: 0; padding-bottom: 12px; }
.sections__strip { display: flex; gap: 2px; }
.section {
  flex: 1 1 0;
  min-width: 6px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: rgba(238, 240, 234, 0.22);
  cursor: pointer;
}
.section:hover { filter: brightness(1.25); }
.section.is-arp {
  background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,0.35) 4px 6px);
}
.section[aria-pressed="true"] { outline: 2px solid var(--paper); outline-offset: 2px; }
.sections__detail {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  min-height: 1.45em;
  margin: 10px 0 0;
  color: var(--paper);
  font-size: 14px;
}
.sections__detail .hint { color: var(--plush-text); }
.sections__detail .btn { min-height: 28px; padding: 2px 10px; font-size: 13px; }

.board {
  margin-top: 12px;
  overflow-x: auto;
  border-radius: 6px;
  background: var(--wood);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
}
.board svg { display: block; width: 100%; min-width: 760px; height: auto; }

.tracks { overflow-y: auto; padding-top: 4px; }
.tracks h2 {
  margin: 0 0 10px;
  color: var(--plush-text);
  font-size: 14px;
  font-weight: 500;
}
.tracks ol { margin: 0; padding: 0; list-style: none; }
.tracks li.hint { color: var(--plush-text); font-size: 14px; }

.track {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}
.track__name {
  min-width: 0;
  padding: 6px 0;
  border: 0;
  background: none;
  color: var(--plush-text);
  font: inherit;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}
.track__name:hover { color: var(--paper); }
.track.is-shown .track__name {
  color: var(--paper);
  font-weight: 650;
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 5px;
}

.chip {
  min-width: 40px;
  padding: 3px 7px;
  border: 1px solid rgba(238, 240, 234, 0.22);
  border-radius: 999px;
  background: transparent;
  color: var(--plush-text);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.chip:hover { color: var(--paper); border-color: var(--paper); }
.chip[aria-pressed="true"] { background: var(--paper); border-color: var(--paper); color: var(--ink); }
.chip.mute[aria-pressed="true"] { background: var(--led-ink); border-color: var(--led-ink); color: #fff; }

.sheet:focus-visible { outline-offset: -3px; }

.sheet {
  position: relative;
  overflow: auto;
  min-height: 0;
  border-radius: 3px 3px 0 0;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
}
#score { min-height: 100%; padding: 8px 0 24px; }

.empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  padding: 24px;
  text-align: center;
}
.empty h2 {
  margin: 0 0 8px;
  font-size: clamp(26px, 3vw, 38px);
  font-stretch: 75%;
  font-weight: 800;
}
.empty p { max-width: 44ch; margin: 0 auto 6px; color: #4a4d55; }
.empty .btn--open { margin-top: 14px; justify-self: center; background: var(--ink); border-color: var(--ink); color: var(--paper); }

.status {
  position: sticky;
  bottom: 14px;
  width: max-content;
  max-width: calc(100% - 28px);
  margin: 0 auto;
  padding: 7px 14px;
  border-radius: 6px;
  background: var(--ink);
  color: var(--paper);
  font-size: 14px;
}
.status.is-error { background: var(--led-ink); color: #fff; }

/* alphaTab overlays on paper */
.at-cursor-bar { background: rgba(47, 107, 87, 0.08); }
.at-cursor-beat { width: 2px; background: var(--led-ink); }
.at-selection div { background: rgba(47, 107, 87, 0.2); }
.at-highlight * { fill: var(--led-ink); stroke: var(--led-ink); }

/* ── The pedal ── */
.pedal-dock {
  display: grid;
  grid-template-columns: 200px minmax(0, 1fr);
  gap: 24px;
  padding: 18px 24px 20px;
}
.pedal-dock .pedal { grid-column: 2; width: 100%; }

.pedal {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px 34px;
  max-width: 980px;
  margin: 0 auto;
  padding: 18px 28px 16px;
  border-radius: 16px;
  background:
    radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1.4px) 0 0 / 5px 5px,
    radial-gradient(rgba(0,0,0,0.12) 1px, transparent 1.4px) 2px 3px / 7px 7px,
    linear-gradient(170deg, var(--enamel), var(--enamel-dark));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -3px 0 rgba(0,0,0,0.25),
    0 14px 30px rgba(0,0,0,0.5);
  color: var(--silk);
}

.silk {
  font-size: 12px;
  font-stretch: 125%;
  font-weight: 750;
  letter-spacing: 0.02em;
}

.readout { display: grid; gap: 6px; justify-items: start; }
.readout .name {
  font-size: 22px;
  font-stretch: 125%;
  font-weight: 900;
  line-height: 1;
}
.led-row { display: flex; align-items: center; gap: 10px; }
.led {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #5a1712;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
}
.led.is-on {
  background: var(--led);
  box-shadow: 0 0 6px var(--led), 0 0 16px rgba(255, 51, 38, 0.55);
}
.time { font-size: 15px; font-variant-numeric: tabular-nums; }

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: center;
  gap: 16px 26px;
}

.fader { display: grid; gap: 6px; justify-items: center; }
.fader input {
  width: 150px;
  height: 22px;
  margin: 0;
  background: transparent;
  appearance: none;
  cursor: pointer;
}
.fader input::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: #13281f;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.7);
}
.fader input::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: #13281f;
}
.fader input::-webkit-slider-thumb {
  width: 14px;
  height: 22px;
  margin-top: -8px;
  border: 0;
  border-radius: 3px;
  background: linear-gradient(90deg, #9da2a8, var(--chrome) 45%, #8d9298);
  box-shadow: 0 2px 3px rgba(0,0,0,0.5);
  appearance: none;
}
.fader input::-moz-range-thumb {
  width: 14px;
  height: 22px;
  border: 0;
  border-radius: 3px;
  background: var(--chrome);
}
.fader input:focus-visible { outline-offset: 4px; }

/* Mini toggle switches */
.switch {
  display: grid;
  gap: 6px;
  justify-items: center;
  padding: 0;
  border: 0;
  background: none;
  color: var(--silk);
  font: inherit;
  cursor: pointer;
}
.switch__body {
  position: relative;
  width: 18px;
  height: 30px;
  border-radius: 9px;
  background: #13281f;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.7);
}
.switch__body::after {
  content: "";
  position: absolute;
  left: 2px;
  bottom: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--chrome);
  box-shadow: 0 1px 2px rgba(0,0,0,0.5);
  transition: transform 120ms ease;
}
.switch[aria-pressed="true"] .switch__body::after { transform: translateY(-12px); }
.switch[aria-pressed="true"] .switch__body { background: #0d1e17; }

.stop {
  display: grid;
  gap: 6px;
  justify-items: center;
  padding: 0;
  border: 0;
  background: none;
  color: var(--silk);
  font: inherit;
  cursor: pointer;
}
.stop__cap {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #f3f4f6, #8d9298 75%);
  box-shadow: 0 2px 3px rgba(0,0,0,0.5);
}
.stop:active:not(:disabled) .stop__cap { transform: translateY(1px); }
.stop:disabled, .footswitch:disabled { opacity: 0.45; cursor: default; }

.footswitch {
  display: grid;
  gap: 8px;
  justify-items: center;
  padding: 0;
  border: 0;
  background: none;
  color: var(--silk);
  font: inherit;
  cursor: pointer;
}
.footswitch__ring {
  display: grid;
  place-items: center;
  width: 74px;
  height: 74px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #6d737a, #2c3035 70%);
  box-shadow: inset 0 2px 3px rgba(255,255,255,0.25), 0 4px 8px rgba(0,0,0,0.5);
}
.footswitch__cap {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #ffffff, var(--chrome) 40%, #7f858b 85%);
  box-shadow: 0 3px 4px rgba(0,0,0,0.55);
  transition: transform 80ms ease, box-shadow 80ms ease;
}
.footswitch:active:not(:disabled) .footswitch__cap {
  transform: translateY(2px) scale(0.97);
  box-shadow: 0 1px 2px rgba(0,0,0,0.55);
}
.footswitch:focus-visible { outline: none; }
.footswitch:focus-visible .footswitch__ring { outline: 2px solid var(--silk); outline-offset: 4px; }

/* ── Drop overlay ── */
.drop {
  position: fixed;
  inset: 12px;
  display: grid;
  place-items: center;
  border: 3px dashed var(--paper);
  border-radius: 16px;
  background: rgba(42, 18, 22, 0.88);
  color: var(--paper);
  font-size: 26px;
  font-stretch: 75%;
  font-weight: 800;
  z-index: 10;
}

/* ── Small screens ── */
@media (max-width: 760px) {
  /* Too short for a fixed-height layout once the fretboard is shown:
     let the page scroll, give the score a fixed share, keep the pedal docked. */
  html, body { height: auto; }
  body { min-height: 100%; }
  .stage { grid-template-rows: auto auto; }
  .sheet { height: 65vh; }
  .pedal-dock { position: sticky; bottom: 0; z-index: 5; }
  .top { grid-template-columns: 1fr; padding: 12px 16px 14px; }
  .song { grid-column: 1; }
  .view { justify-content: flex-start; }
  .desk { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 12px; padding: 0 16px; }
  .tracks ol { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
  .tracks h2 { display: none; }
  .track { flex: none; }
  .track__name { max-width: 150px; }
  .pedal-dock { grid-template-columns: 1fr; padding: 12px 16px 14px; }
  .pedal-dock .pedal { grid-column: 1; }
  .pedal { grid-template-columns: 1fr auto; gap: 14px 16px; padding: 14px 16px; }
  .controls {
    grid-column: 1 / -1;
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(5, auto);
    justify-content: space-between;
    gap: 14px 10px;
  }
  .fader { grid-column: 1 / -1; }
  .fader input { width: 100%; min-width: 220px; }
  .footswitch__ring { width: 62px; height: 62px; }
  .footswitch__cap { width: 42px; height: 42px; }
}

@media (prefers-reduced-motion: reduce) {
  .switch__body::after, .footswitch__cap { transition: none; }
}
  </style>
</head>
<body>
  <header class="top">
    <a class="home" href="../">← coolThing</a>
    <div class="song">
      <h1 id="songTitle" class="is-empty">MQ-TAB</h1>
      <p id="songArtist">Guitar Pro reader and player</p>
      <div class="key" id="boxKey" aria-live="polite" hidden></div>
    </div>
    <div class="view">
      <select class="select" id="staveSel" aria-label="Notation">
        <option value="default">Notation: auto</option>
        <option value="scoretab">Score and tab</option>
        <option value="tab">Tab only</option>
        <option value="score">Score only</option>
      </select>
      <select class="select" id="layoutSel" aria-label="Layout">
        <option value="page">Page</option>
        <option value="horizontal">One long line</option>
      </select>
      <span class="zoom">
        <button class="btn" id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <output id="zoomLabel" aria-label="Zoom">100%</output>
        <button class="btn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
      </span>
      <label class="btn btn--open" for="fileInput">Open file</label>
      <input id="fileInput" type="file" accept=".gp,.gp3,.gp4,.gp5,.gpx,.gp7,.gp8,.musicxml,.xml,.mxl" hidden>
    </div>
  </header>

  <div class="desk">
    <nav class="tracks" aria-label="Tracks">
      <h2>Tracks</h2>
      <ol id="trackList"><li class="hint">None yet.</li></ol>
    </nav>

    <div class="stage">
    <section class="sections" id="sections" aria-label="Sections" hidden>
      <div class="sections__strip" id="sectionStrip"></div>
      <p class="sections__detail" id="sectionDetail" aria-live="polite"></p>
      <div class="board" id="board"></div>
    </section>
    <main class="sheet" id="viewport" tabindex="0" aria-label="Score">
      <div id="score"></div>
      <section class="empty" id="empty">
        <h2>Open a Guitar Pro file</h2>
        <p>Drop it anywhere on the page, or choose one from your computer.</p>
        <p>Reads gp3, gp4, gp5, gpx, Guitar Pro 7 and 8, and MusicXML.</p>
        <label class="btn btn--open" for="fileInput">Open file</label>
      </section>
      <div class="status" id="status" role="status" hidden></div>
    </main>
    </div>
  </div>

  <footer class="pedal-dock">
    <div class="pedal" role="group" aria-label="Playback">
      <div class="readout">
        <span class="name" aria-hidden="true">mq-tab</span>
        <span class="led-row">
          <span class="led" id="led" aria-hidden="true"></span>
          <span class="time" id="time">0:00 / 0:00</span>
        </span>
      </div>

      <div class="controls">
        <label class="fader">
          <input type="range" id="speed" min="25" max="150" step="5" value="100" aria-valuetext="100 percent">
          <span class="silk">tempo <output id="speedOut">100%</output></span>
        </label>
        <button class="switch" id="loopBtn" type="button" aria-pressed="false" title="Loop the selected bars (L)">
          <span class="switch__body" aria-hidden="true"></span><span class="silk">loop</span>
        </button>
        <button class="switch" id="metroBtn" type="button" aria-pressed="false" title="Metronome (M)">
          <span class="switch__body" aria-hidden="true"></span><span class="silk">click</span>
        </button>
        <button class="switch" id="countBtn" type="button" aria-pressed="false" title="Count in one bar before playing">
          <span class="switch__body" aria-hidden="true"></span><span class="silk">count-in</span>
        </button>
        <button class="switch" id="boxBtn" type="button" aria-pressed="false" title="Colour tab numbers by pentatonic box (B)">
          <span class="switch__body" aria-hidden="true"></span><span class="silk">boxes</span>
        </button>
        <button class="stop" id="stopBtn" type="button" disabled title="Stop and go back to the start (Esc)">
          <span class="stop__cap" aria-hidden="true"></span><span class="silk">stop</span>
        </button>
      </div>

      <button class="footswitch" id="playBtn" type="button" disabled title="Play or pause (Space)">
        <span class="footswitch__ring" aria-hidden="true"><span class="footswitch__cap"></span></span>
        <span class="silk" id="playLabel">play</span>
      </button>
    </div>
  </footer>

  <div class="drop" id="drop" hidden><span>Drop to open</span></div>

  <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.js"></script>
  <script src="analysis.js"></script>
  <script>
// mq-tab — Guitar Pro reader and player on top of alphaTab.
(function () {
  "use strict";

  const AT_BASE = "https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/";
  const $ = (id) => document.getElementById(id);

  const el = {
    score: $("score"), viewport: $("viewport"), empty: $("empty"), status: $("status"),
    title: $("songTitle"), artist: $("songArtist"), trackList: $("trackList"),
    file: $("fileInput"), drop: $("drop"),
    play: $("playBtn"), playLabel: $("playLabel"), led: $("led"), stop: $("stopBtn"), time: $("time"),
    speed: $("speed"), speedOut: $("speedOut"),
    loop: $("loopBtn"), metro: $("metroBtn"), count: $("countBtn"), boxes: $("boxBtn"), key: $("boxKey"),
    sections: $("sections"), strip: $("sectionStrip"), detail: $("sectionDetail"), board: $("board"),
    stave: $("staveSel"), layout: $("layoutSel"),
    zoomIn: $("zoomIn"), zoomOut: $("zoomOut"), zoomLabel: $("zoomLabel"),
  };

  // ── Status line ──
  let statusTimer = null;
  function showStatus(text, isError, sticky) {
    clearTimeout(statusTimer);
    el.status.textContent = text;
    el.status.classList.toggle("is-error", !!isError);
    el.status.hidden = false;
    if (!isError && !sticky) statusTimer = setTimeout(() => { el.status.hidden = true; }, 2200);
  }

  if (!window.alphaTab) {
    showStatus("The music engine did not load. Check your connection and reload the page.", true);
    return;
  }

  const INK = "#1d1f24";
  const api = new alphaTab.AlphaTabApi(el.score, {
    core: { fontDirectory: AT_BASE + "font/" },
    display: {
      scale: 1,
      resources: {
        staffLineColor: "#9a9ea6",
        barSeparatorColor: "#5d6169",
        barNumberColor: "#5d6169",
        mainGlyphColor: INK,
        secondaryGlyphColor: "rgba(29,31,36,0.45)",
        scoreInfoColor: INK,
      },
    },
    player: {
      playerMode: alphaTab.PlayerMode.EnabledAutomatic,
      soundFont: AT_BASE + "soundfont/sonivox.sf2",
      scrollElement: el.viewport,
      enableCursor: true,
      enableAnimatedBeatCursor: true,
      enableUserInteraction: true,
    },
  });

  let score = null;
  let shownTrack = 0;
  let zoom = 1;
  let soundReady = false;

  // ── Loading ──
  function loadFile(file) {
    if (!file) return;
    showStatus("Opening " + file.name + "…", false, true);
    file.arrayBuffer().then((buf) => {
      try {
        if (!api.load(new Uint8Array(buf), [0])) {
          showStatus(file.name + " is not a format mq-tab can read. Try a gp3–gp8, gpx or MusicXML file.", true);
        }
      } catch (err) {
        showStatus("Could not open " + file.name + ": " + err.message, true);
      }
    });
  }

  el.file.addEventListener("change", () => { loadFile(el.file.files[0]); el.file.value = ""; });

  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; el.drop.hidden = false; });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; el.drop.hidden = true; } });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    el.drop.hidden = true;
    loadFile(e.dataTransfer.files[0]);
  });

  api.error.on((err) => showStatus("Something went wrong: " + (err && err.message ? err.message : err), true));

  api.scoreLoaded.on((s) => {
    score = s;
    shownTrack = 0;
    el.empty.hidden = true;
    el.title.classList.remove("is-empty");
    el.title.textContent = s.title || "Untitled";
    const by = s.artist ? "by " + s.artist : "";
    el.artist.textContent = s.album ? (by ? by + ", from " + s.album : "from " + s.album) : by;
    document.title = (s.title || "Untitled") + " — MQ-TAB";
    buildTracks();
    resetBoxes(s);
  });

  api.renderStarted.on(() => showStatus("Drawing the score…", false, true));
  api.renderFinished.on(() => { el.status.hidden = true; });

  api.soundFontLoaded.on(() => { soundReady = true; });
  api.playerReady.on(() => {
    el.play.disabled = false;
    el.stop.disabled = false;
    if (selectedSection >= 0) applySectionRange();
  });

  // ── Tracks ──
  function chip(label, cls, title) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip " + cls;
    b.textContent = label;
    b.title = title;
    b.setAttribute("aria-pressed", "false");
    return b;
  }

  function buildTracks() {
    el.trackList.innerHTML = "";
    score.tracks.forEach((track, i) => {
      const label = track.name || "Track " + (i + 1);
      const li = document.createElement("li");
      li.className = "track" + (i === shownTrack ? " is-shown" : "");

      const name = document.createElement("button");
      name.type = "button";
      name.className = "track__name";
      name.textContent = label;
      name.title = "Show " + label;
      name.setAttribute("aria-current", i === shownTrack ? "true" : "false");
      name.addEventListener("click", () => showTrack(i));

      const mute = chip("mute", "mute", "Mute " + label);
      mute.setAttribute("aria-label", "Mute " + label);
      mute.addEventListener("click", () => {
        const on = mute.getAttribute("aria-pressed") !== "true";
        mute.setAttribute("aria-pressed", String(on));
        api.changeTrackMute([track], on);
      });

      const solo = chip("solo", "solo", "Solo " + label);
      solo.setAttribute("aria-label", "Solo " + label);
      solo.addEventListener("click", () => {
        const on = solo.getAttribute("aria-pressed") !== "true";
        solo.setAttribute("aria-pressed", String(on));
        api.changeTrackSolo([track], on);
      });

      li.append(name, mute, solo);
      el.trackList.appendChild(li);
    });
  }

  function showTrack(i) {
    if (!score || i === shownTrack) return;
    shownTrack = i;
    dropHighlight();
    if (boxesOn) applyBoxes(i);
    api.renderTracks([score.tracks[i]]);
    Array.from(el.trackList.children).forEach((li, j) => {
      li.classList.toggle("is-shown", j === i);
      li.querySelector(".track__name").setAttribute("aria-current", j === i ? "true" : "false");
    });
  }

  // ── Transport ──
  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };

  let lastSecond = -1;
  api.playerPositionChanged.on((e) => {
    const sec = Math.floor(e.currentTime / 1000);
    if (sec === lastSecond) return;
    lastSecond = sec;
    el.time.textContent = fmt(e.currentTime) + " / " + fmt(e.endTime);
  });

  api.playerStateChanged.on((e) => {
    const playing = e.state === alphaTab.synth.PlayerState.Playing;
    el.led.classList.toggle("is-on", playing);
    el.playLabel.textContent = playing ? "pause" : "play";
  });

  el.play.addEventListener("click", () => {
    if (!soundReady) showStatus("Loading the sound bank…", false, true);
    api.playPause();
  });
  el.stop.addEventListener("click", () => api.stop());

  el.speed.addEventListener("input", () => {
    const v = Number(el.speed.value);
    el.speedOut.textContent = v + "%";
    el.speed.setAttribute("aria-valuetext", v + " percent");
    api.playbackSpeed = v / 100;
  });

  function toggle(btn, apply) {
    const on = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", String(on));
    apply(on);
  }
  el.loop.addEventListener("click", () => toggle(el.loop, (on) => { api.isLooping = on; }));
  el.metro.addEventListener("click", () => toggle(el.metro, (on) => { api.metronomeVolume = on ? 1 : 0; }));
  el.count.addEventListener("click", () => toggle(el.count, (on) => { api.countInVolume = on ? 1 : 0; }));

  // ── Pentatonic boxes (analysis from Pentabox, see analysis.js) ──
  const A = window.MQTabAnalysis;
  const BOX_COLORS = [1, 2, 3, 4, 5].map((b) =>
    alphaTab.model.Color.fromJson(getComputedStyle(document.documentElement).getPropertyValue("--box" + b).trim()));
  const MINOR = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "G#", "A", "Bb", "B"];
  const MAJOR = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
  let boxesOn = false;
  let adapted = null;
  let analysisCache = {};

  function scaleName(root, mode) {
    return mode === "minor"
      ? MINOR[root] + " minor pentatonic"
      : MAJOR[(root + 3) % 12] + " major pentatonic";
  }

  function forEachNote(track, fn) {
    for (const bar of track.staves[0].bars)
      for (const voice of bar.voices)
        for (const beat of voice.beats)
          for (const note of beat.notes) fn(note);
  }

  function colourNote(note, box) {
    if (!box) { note.style = undefined; return; }
    const style = new alphaTab.model.NoteStyle();
    style.colors.set(alphaTab.model.NoteSubElement.GuitarTabFretNumber, BOX_COLORS[box - 1]);
    note.style = style;
  }

  function showKey(html) {
    el.key.innerHTML = html;
    el.key.hidden = false;
  }

  function applyBoxes(ti) {
    if (!adapted) return;
    const track = adapted.song.tracks[ti];
    if (track.percussion) { showKey("Drum tracks have no scale boxes."); hideSections(); return; }
    const res = analysisCache[ti] || (analysisCache[ti] = A.analyze(adapted.song, ti));
    noteInfo = new Map();
    boardSegment = -1;
    // Only colour sections that are actually pentatonic or arpeggios, as Pentabox does.
    for (const seg of res.segments) {
      if (seg.empty) continue;
      const colourable = seg.kind === "pentatonic" || seg.kind === "arpeggio";
      for (const n of seg.notes) {
        const note = adapted.noteAt(ti, n.measure, n.beat, n.string);
        if (!note) continue;
        const box = colourable && n.analyzed && n.region ? n.region.box : 0;
        colourNote(note, box);
        if (n.analyzed) noteInfo.set(note, { string: n.string, fret: n.fret, box: box, label: degreeLabel(n.pc, seg) });
      }
    }
    clearSection();
    buildSections();
    const g = res.global;
    const fingered = res.tinfo.shift ? " as fingered" : "";
    showKey(
      "<span>" + scaleName(g.root, g.mode) + fingered + ", " + Math.round(g.coverage * 100) + " % of notes</span>" +
      '<span class="key__boxes" aria-label="Box colours">' +
      [1, 2, 3, 4, 5].map((b) => '<span style="color:var(--box' + b + ')">' + b + "</span>").join("") +
      "</span>");
  }

  function clearBoxes() {
    if (score) score.tracks.forEach((t) => forEachNote(t, (n) => { n.style = undefined; }));
    el.key.hidden = true;
    hideSections();
  }

  // ── Sections: why bars are (not) coloured, and loop one by clicking it ──
  let selectedSection = -1;
  let loopBefore = false;
  let settingRange = false;
  let sectionRange = null;

  // alphaTab 1.8.4: clearPlaybackRangeHighlight() hides the selection but keeps
  // the beats, and every later render re-highlights them. Once those beats are
  // not on screen (another track, another file) that throws inside alphaTab.
  // Reset the two fields as well. Re-check when upgrading alphaTab.
  function dropHighlight() {
    api.clearPlaybackRangeHighlight();
    api._selectionStart = undefined;
    api._selectionEnd = undefined;
  }

  function barsLabel(seg) {
    return seg.to > seg.from ? "Bars " + (seg.from + 1) + "–" + (seg.to + 1) : "Bar " + (seg.from + 1);
  }

  function mainBox(seg) {
    if (seg.kind !== "pentatonic" && seg.kind !== "arpeggio") return 0;
    return seg.regions && seg.regions.length ? seg.regions[0].region.box : 0;
  }

  function outsideNotes(seg) {
    const shift = seg.mode === "minor" ? 0 : 3;
    const list = seg.extra.filter((e) => e.share >= 0.03).slice(0, 3)
      .map((e) => A.DEGREE_NAMES[(e.rel - shift + 12) % 12] + " (" + Math.round(e.share * 100) + " %)");
    return list.length ? " Outside the scale: " + list.join(", ") + "." : "";
  }

  function describeSection(seg) {
    const scale = scaleName(seg.root, seg.mode);
    const cov = Math.round(seg.coverage * 100);
    if (seg.kind === "sparse") {
      return "Only " + seg.distinctPcs + " different notes, too few to tell the scale. Not coloured.";
    }
    if (seg.kind === "other") {
      return "Only " + cov + " % of the notes fit the nearest pentatonic scale (" + scale + "). Not coloured." + outsideNotes(seg);
    }
    const boxes = seg.regions.filter((r) => r.share >= 0.05)
      .map((r) => "box " + r.region.box + " (frets " + r.region.minFret + "–" + r.region.maxFret + ")");
    const where = boxes.length ? " Played in " + boxes.join(", ") + "." : "";
    if (seg.kind === "arpeggio") {
      const chords = [...new Set(seg.annotations)].slice(0, 5);
      return "Mostly chord tones (" + (seg.tapShare >= 0.2 ? "tapped arpeggios" : "arpeggios") +
        "), so the chords lead rather than a scale. Coloured by the " + scale + " boxes." +
        (chords.length ? " Chords: " + chords.join(", ") + "." : "") + where;
    }
    return scale + ", " + cov + " % of the notes." + where + outsideNotes(seg);
  }

  function currentSegments() {
    const res = analysisCache[shownTrack];
    return res ? res.segments : [];
  }

  function buildSections() {
    const segs = currentSegments();
    selectedSection = -1;
    el.strip.innerHTML = "";
    segs.forEach((seg, i) => {
      if (seg.empty) return;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "section" + (seg.kind === "arpeggio" ? " is-arp" : "");
      b.style.flexGrow = String(seg.to - seg.from + 1);
      const box = mainBox(seg);
      if (box) b.style.backgroundColor = "var(--box" + box + ")";
      b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", barsLabel(seg) + ": " + describeSection(seg));
      b.title = barsLabel(seg);
      b.dataset.index = String(i);
      b.addEventListener("click", () => selectSection(i));
      el.strip.appendChild(b);
    });
    showSectionHint();
    el.sections.hidden = !el.strip.children.length;
    if (!el.sections.hidden) drawBoard(firstColourable(segs));
  }

  function showSectionHint() {
    el.detail.innerHTML = '<span class="hint">Pick a section to see its scale and loop it.</span>';
  }

  function hideSections() {
    clearSection();
    el.sections.hidden = true;
  }

  function applySectionRange() {
    const seg = currentSegments()[selectedSection];
    if (!seg || !api.tickCache || !score) return;
    const bars = score.masterBars;
    const startTick = api.tickCache.getMasterBarStart(bars[seg.from]);
    const endTick = api.tickCache.getMasterBarStart(bars[seg.to]) + bars[seg.to].calculateDuration();
    sectionRange = { startTick: startTick, endTick: endTick };
    settingRange = true;
    api.playbackRange = sectionRange;
    settingRange = false;
    api.tickPosition = startTick;
  }

  function selectSection(i) {
    if (i === selectedSection) { clearSection(); return; }
    const seg = currentSegments()[i];
    if (!seg) return;
    if (selectedSection < 0) loopBefore = el.loop.getAttribute("aria-pressed") === "true";
    selectedSection = i;
    Array.from(el.strip.children).forEach((b) =>
      b.setAttribute("aria-pressed", String(Number(b.dataset.index) === i)));

    const staff = score.tracks[shownTrack].staves[0];
    const first = staff.bars[seg.from].voices[0].beats[0];
    const lastBeats = staff.bars[seg.to].voices[0].beats;
    api.highlightPlaybackRange(first, lastBeats[lastBeats.length - 1]);

    el.loop.setAttribute("aria-pressed", "true");
    api.isLooping = true;
    applySectionRange();
    scrollToSelection();
    drawBoard(i);

    el.detail.innerHTML = "";
    const text = document.createElement("span");
    text.textContent = barsLabel(seg) + ": " + describeSection(seg);
    const clear = document.createElement("button");
    clear.type = "button";
    clear.className = "btn";
    clear.textContent = "Stop looping section";
    clear.addEventListener("click", clearSection);
    el.detail.append(text, clear);
  }

  // The selection markers are placed synchronously, so scroll to them rather
  // than to the cursor, which only moves once the player catches up.
  function scrollToSelection() {
    const first = el.score.querySelector(".at-selection div");
    if (!first) return;
    const v = el.viewport.getBoundingClientRect();
    const r = first.getBoundingClientRect();
    el.viewport.scrollTo({
      top: el.viewport.scrollTop + r.top - v.top - 16,
      left: el.viewport.scrollLeft + r.left - v.left - 16,
    });
  }

  function clearSection() {
    if (selectedSection < 0) return;
    selectedSection = -1;
    Array.from(el.strip.children).forEach((b) => b.setAttribute("aria-pressed", "false"));
    settingRange = true;
    api.playbackRange = null;
    settingRange = false;
    dropHighlight();
    el.loop.setAttribute("aria-pressed", String(loopBefore));
    api.isLooping = loopBefore;
    showSectionHint();
  }

  // ── Fretboard: the current section's boxes, and the notes being played ──
  let noteInfo = new Map();
  let boardSegment = -1;
  const FB = { nut: 40, fret: 42, top: 22, gap: 18, frets: 24 };
  const fx = (f) => (f === 0 ? FB.nut / 2 : FB.nut + (f - 0.5) * FB.fret);

  function degreeLabel(pc, seg) {
    const tonicPc = seg.mode === "minor" ? seg.root : (seg.root + 3) % 12;
    return A.DEGREE_NAMES[(pc - tonicPc + 24) % 12];
  }

  function firstColourable(segs) {
    const i = segs.findIndex((s) => !s.empty && (s.kind === "pentatonic" || s.kind === "arpeggio"));
    return i >= 0 ? i : segs.findIndex((s) => !s.empty);
  }

  function drawBoard(i) {
    const res = analysisCache[shownTrack];
    const seg = res && res.segments[i];
    if (!seg || seg.empty) { el.board.hidden = true; boardSegment = -1; return; }
    boardSegment = i;
    const tuning = res.tinfo.fingered;
    const ns = tuning.length;
    const sy = (st) => FB.top + (st - 1) * FB.gap;
    const W = FB.nut + FB.frets * FB.fret + 10;
    const H = FB.top + (ns - 1) * FB.gap + 22;
    const mid = FB.top + (ns - 1) * FB.gap / 2;
    const colourable = seg.kind === "pentatonic" || seg.kind === "arpeggio";
    const tonicPc = seg.mode === "minor" ? seg.root : (seg.root + 3) % 12;
    let g = "";
    if (colourable) {
      for (const r of seg.regions.filter((x) => x.share >= 0.05)) {
        const v = r.region;
        const x0 = v.minFret === 0 ? 2 : FB.nut + (v.minFret - 1) * FB.fret + 3;
        const x1 = FB.nut + v.maxFret * FB.fret - 3;
        g += '<rect x="' + x0 + '" y="' + (FB.top - 12) + '" width="' + (x1 - x0) + '" height="' + ((ns - 1) * FB.gap + 24) +
          '" rx="6" fill="var(--box' + v.box + '-hi)" fill-opacity=".16" stroke="var(--box' + v.box + '-hi)" stroke-width="1.5"/>';
      }
    }
    for (const f of [3, 5, 7, 9, 15, 17, 19, 21]) g += '<circle cx="' + fx(f) + '" cy="' + mid + '" r="4" fill="#eef0ea" fill-opacity=".18"/>';
    for (const f of [12, 24]) for (const d of [-1, 1]) g += '<circle cx="' + fx(f) + '" cy="' + (mid + d * FB.gap) + '" r="4" fill="#eef0ea" fill-opacity=".18"/>';
    for (let f = 0; f <= FB.frets; f++) {
      const x = FB.nut + f * FB.fret;
      g += '<line x1="' + x + '" x2="' + x + '" y1="' + (FB.top - 5) + '" y2="' + (FB.top + (ns - 1) * FB.gap + 5) + '" stroke="#b9ad98" stroke-width="' + (f === 0 ? 4 : 1.2) + '"/>';
      if (f > 0 && [3, 5, 7, 9, 12, 15, 17, 19, 21, 24].includes(f)) {
        g += '<text x="' + fx(f) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="10" fill="#eef0ea" fill-opacity=".6">' + f + "</text>";
      }
    }
    for (let st = 1; st <= ns; st++) {
      g += '<line x1="' + FB.nut + '" x2="' + (W - 10) + '" y1="' + sy(st) + '" y2="' + sy(st) + '" stroke="#eef0ea" stroke-opacity=".5" stroke-width="' + (0.7 + st * 0.25) + '"/>';
      g += '<text x="6" y="' + (sy(st) + 4) + '" font-size="11" fill="#eef0ea" fill-opacity=".7">' + MINOR[(tuning[st - 1] % 12 + 12) % 12] + "</text>";
      for (let f = 0; f <= FB.frets; f++) {
        const pc = ((tuning[st - 1] + f) % 12 + 12) % 12;
        if (!A.MINOR_PENT.includes((pc - seg.root + 12) % 12)) continue;
        const root = pc === tonicPc;
        g += '<circle cx="' + fx(f) + '" cy="' + sy(st) + '" r="6.5" fill="none" stroke="#eef0ea" stroke-opacity="' + (root ? 0.85 : 0.3) + '" stroke-width="' + (root ? 2 : 1) + '"/>';
      }
    }
    el.board.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Fretboard for ' +
      barsLabel(seg).toLowerCase() + ": " + scaleName(seg.root, seg.mode) + ', rings mark scale notes, bold rings the root">' +
      g + '<g id="boardNotes"></g></svg>';
    el.board.hidden = false;
  }

  function drawPlayed(beat) {
    const layer = el.board.querySelector("#boardNotes");
    if (!layer) return;
    const sy = (st) => FB.top + (st - 1) * FB.gap;
    let g = "";
    for (const note of beat ? beat.notes : []) {
      const info = noteInfo.get(note);
      if (!info) continue;
      const x = fx(info.fret), y = sy(info.string);
      if (info.box) {
        g += '<circle cx="' + x + '" cy="' + y + '" r="9.5" fill="var(--box' + info.box + '-hi)" stroke="var(--wood)" stroke-width="1.5"/>';
        g += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#1d1f24">' + info.label + "</text>";
      } else {
        g += '<circle cx="' + x + '" cy="' + y + '" r="9.5" fill="var(--wood)" stroke="#eef0ea" stroke-width="1.5" stroke-dasharray="3 2"/>';
        g += '<text x="' + x + '" y="' + (y + 3.5) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#eef0ea">' + info.label + "</text>";
      }
    }
    layer.innerHTML = g;
  }

  // Follow playback: switch to the section being played unless one is picked.
  api.playedBeatChanged.on((beat) => {
    if (!boxesOn || !beat || el.sections.hidden) return;
    if (selectedSection < 0) {
      const bar = beat.voice.bar.index;
      const segs = currentSegments();
      const i = segs.findIndex((s) => !s.empty && bar >= s.from && bar <= s.to);
      if (i >= 0 && i !== boardSegment) drawBoard(i);
    }
    drawPlayed(beat);
  });

  // A range dragged by hand in the score replaces the section selection.
  // The event also arrives (asynchronously) for ranges set here, so compare.
  api.playbackRangeChanged.on((e) => {
    if (settingRange || selectedSection < 0) return;
    const r = e && e.playbackRange;
    if (r && sectionRange && r.startTick === sectionRange.startTick && r.endTick === sectionRange.endTick) return;
    selectedSection = -1;
    Array.from(el.strip.children).forEach((b) => b.setAttribute("aria-pressed", "false"));
    showSectionHint();
  });

  function resetBoxes(s) {
    // A new score: forget the old section and give the loop switch back its own state.
    if (selectedSection >= 0) {
      selectedSection = -1;
      settingRange = true;
      api.playbackRange = null;
      settingRange = false;
      el.loop.setAttribute("aria-pressed", String(loopBefore));
      api.isLooping = loopBefore;
    }
    dropHighlight();
    el.sections.hidden = true;
    analysisCache = {};
    adapted = A ? A.songFromAlphaTab(s) : null;
    if (boxesOn) applyBoxes(shownTrack);
  }

  if (!A) el.boxes.disabled = true;
  el.boxes.addEventListener("click", () => toggle(el.boxes, (on) => {
    boxesOn = on;
    if (!score) return;
    if (on) applyBoxes(shownTrack); else clearBoxes();
    api.renderTracks([score.tracks[shownTrack]]);
  }));

  // ── View ──
  function rerender() {
    api.updateSettings();
    if (score) api.render();
  }

  const STAVE = {
    default: alphaTab.StaveProfile.Default,
    scoretab: alphaTab.StaveProfile.ScoreTab,
    tab: alphaTab.StaveProfile.Tab,
    score: alphaTab.StaveProfile.Score,
  };
  el.stave.addEventListener("change", () => {
    api.settings.display.staveProfile = STAVE[el.stave.value];
    rerender();
  });

  el.layout.addEventListener("change", () => {
    api.settings.display.layoutMode = el.layout.value === "horizontal"
      ? alphaTab.LayoutMode.Horizontal
      : alphaTab.LayoutMode.Page;
    rerender();
  });

  function setZoom(next) {
    zoom = Math.min(2, Math.max(0.5, Math.round(next * 10) / 10));
    el.zoomLabel.textContent = Math.round(zoom * 100) + "%";
    api.settings.display.scale = zoom;
    rerender();
  }
  el.zoomIn.addEventListener("click", () => setZoom(zoom + 0.1));
  el.zoomOut.addEventListener("click", () => setZoom(zoom - 0.1));

  // ── Keyboard ──
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
    if (e.key === " " && !el.play.disabled) { e.preventDefault(); el.play.click(); }
    else if (e.key === "Escape" && !el.stop.disabled) el.stop.click();
    else if (e.key === "l" || e.key === "L") el.loop.click();
    else if (e.key === "m" || e.key === "M") el.metro.click();
    else if ((e.key === "b" || e.key === "B") && !el.boxes.disabled) el.boxes.click();
    else if (e.key === "+" || e.key === "=") el.zoomIn.click();
    else if (e.key === "-") el.zoomOut.click();
  });

  // Exposed for debugging in the console.
  window.mqTab = { api };
})();
  </script>
</body>
</html>
