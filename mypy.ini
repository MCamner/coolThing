[mypy]
python_version = 3.11
# tests import `backend.app`; without this mypy sees backend/app.py twice.
explicit_package_bases = True

# Heavy runtime deps are not installed in CI. Locally they are, and mypy then
# checks against their real types.
[mypy-yt_dlp.*,basic_pitch.*,librosa.*,numpy.*,faster_whisper.*,openai.*]
ignore_missing_imports = True
