name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lightweight-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: >-
          python -m pip install
          fastapi==0.136.1
          pydantic==2.13.3
          python-multipart==0.0.29
          requests==2.33.1

      - name: Run backend safety tests
        run: python -m unittest discover -s tests -v

      - name: Run PromptImage smoke test
        run: ./tools/smoke-prompt-image.sh

      - name: Check documentation contracts
        run: ./tools/check-docs.sh

      - name: Check shell syntax
        run: bash -n tools/*.sh release.sh
